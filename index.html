<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Race | Remastered</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <main class="main-wrapper">
        <header class="header">
            <h1 class="game-title">Sonic Race</h1>
        </header>

        <section id="game-container">
            <!-- Tela de Início / Overlay -->
            <div id="start-screen" class="overlay active">
                <img class="img-banner" src="./assets/img/destaque_sonic.gif" alt="Destaque Sonic">
                <button id="btn-start" class="btn-primary" type="button">Clique para Iniciar</button>
            </div>

            <!-- Camada de Entidades e Sprites -->
            <div id="game-viewport">
                <img id="sonic" class="sprite" src="./assets/img/sonic.gif" alt="Sonic">
                <img id="robotnik" class="sprite enemy" src="./assets/img/robotnik.gif" alt="Dr. Robotnik">
                <img id="butterdroid" class="sprite enemy" src="./assets/img/butterdroid.gif" alt="Butterdroid">
                <img id="crab" class="sprite enemy" src="./assets/img/crab.gif" alt="Crab">
            </div>

            <!-- Placar Superior -->
            <div class="hud-score">
                <img class="icon-score" src="./assets/img/score.png" alt="Placar">
                <span id="score-display">00000</span>
            </div>

            <!-- Instruções Rápidas -->
            <div class="controls-hint">
                <span><strong>W:</strong> Pular</span> | <span><strong>S:</strong> Abaixar</span>
            </div>
        </section>

        <!-- Elementos de Áudio -->
        <audio id="bg-music" src="./assets/sounds/song_sonic.mp3" preload="auto" loop></audio>
        <audio id="jump-sound" src="./assets/sounds/Sonic_Jump.mp3" preload="auto"></audio>
        <audio id="gameover-sound" src="./assets/sounds/Sonic_Game_Over.mp3" preload="auto"></audio>
    </main>

    <footer class="footer">
        <p>© 2026 Copyright · Desenvolvido por Ana Caroline Vasconcellos</p>
    </footer>

    <!-- Scripts da versão Web -->
    <script src="./assets/js/jquery-1.11.1.min.js"></script>
    <script src="./assets/js/main.js" defer></script>
</body>
</html>
